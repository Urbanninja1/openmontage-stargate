# OpenMontage — Stargate-local config (Stargate fork override)
#
# This file OVERRIDES upstream defaults. All cloud providers disabled;
# every pipeline routes through local Stargate services.
#
# See docs/specs/openmontage.md and docs/plans/2026-04-20-feat-lane-6-openmontage-fork-plan.md

llm:
  provider: openai              # OpenAI-compat adapter → llama-swap
  model: qwopus-27b
  base_url: http://127.0.0.1:8080/v1
  temperature: 0.7
  max_tokens: 4096
  per_stage_model:
    research: qwopus-27b
    script: qwen3.5-397b
    review: qwen3.6-35b-a3b-hauhau-p6000
    storyboard_annotate: gemma-4-31b-uncensored

budget:
  mode: observe                  # observe | warn | cap
  total_usd: 0.00                # local only — no cost
  reserve_pct: 0.10
  single_action_approval_usd: 0.00
  require_approval_for_new_paid_tool: false

checkpoint:
  policy: auto_noncreative       # guided | manual_all | auto_noncreative
  storage_dir: pipeline

output:
  default_format: mp4
  default_codec: libx264
  default_audio_codec: aac
  default_resolution: "1920x1080"
  default_fps: 30
  default_crf: 23
  dir: /home/edson/stargate/output/productions
  sidecar_metadata: true
  auto_register: true            # POST to Agent API /output/record after success

paths:
  pipeline_dir: pipeline
  library_dir: library
  styles_dir: styles
  skills_dir: skills
  output_dir: output

# Stargate additions — provider allowlist
providers:
  allowlist:
    tts: [fish_stargate, kokoro_stargate, indextts_stargate, ensemble_stargate, piper_tts]
    video_gen: [comfy_wan_stargate, comfy_hunyuan_stargate]
    image_gen: [comfy_image_stargate]
    research: [rag_platform_stargate, searxng_stargate, crawl4ai_stargate]
    multi_speaker_tts: [ensemble_stargate]
    url_extract: [crawl4ai_stargate]
    web_search: [searxng_stargate]
    music: [freesound_music]
  disabled:
    - elevenlabs_tts
    - openai_tts
    - google_tts
    - runway_video
    - kling_video
    - veo_video
    - minimax_video
    - heygen_video
    - seedance_video
    - seedance_replicate
    - higgsfield_video
    - grok_video
    - cogvideo_video
    - openai_image
    - google_imagen
    - flux_image
    - recraft_image
    - suno_music

rendering:
  ffmpeg_override: nvenc_3090_2
  nvenc_args: ["-c:v", "h264_nvenc", "-preset", "p5", "-rc", "vbr",
               "-b:v", "12M", "-maxrate", "16M", "-bufsize", "24M", "-gpu", "2"]
  fallback_codec: libx264
  fallback_args: ["-c:v", "libx264", "-preset", "veryfast", "-crf", "23"]
  temp_dir: /scratch/openmontage/
  chunk_size_minutes: 3
  chromium_restart_interval_minutes: 10
  chromium_gl: angle-egl

mode_lease:
  provider: stargate_rag_platform
  lease_base: http://127.0.0.1:8104/v1/runtime/mode
  default_duration_minutes: 90
  fallback_switch_url: http://127.0.0.1:8096/voice/mode

character:
  source: /home/edson/stargate/data/characters
